name: ci

# The Android repository's own gate: the Rust bridge and the Gradle APK. The
# bridge fetches the kit build helper from the pinned git tag, so that job
# needs KITS_READ_TOKEN (contents:read on warp-suite). The Gradle job has no
# Rust dependency.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure the kit read token
        env:
          KITS_READ_TOKEN: ${{ secrets.KITS_READ_TOKEN }}
        run: |
          if [ -z "$KITS_READ_TOKEN" ]; then
            echo "::error::KITS_READ_TOKEN is not set; the kit git dependency cannot be fetched"
            exit 1
          fi
          git config --global url."https://x-access-token:${KITS_READ_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Read the pinned channel
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
        id: toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Version consistency
        run: python3 scripts/version.py check

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -p warp-android-scribe-bridge -- -D warnings

      - name: cargo test
        run: cargo test --locked -p warp-android-scribe-bridge

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Gradle build
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

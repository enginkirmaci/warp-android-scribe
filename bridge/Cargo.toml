[package]
name = "warp-android-scribe-bridge"
version.workspace = true
edition.workspace = true
description = "LAN HTTP bridge that turns Superwhisper CLI transcriptions into a bearer-token API for warp-android-scribe"
license.workspace = true
publish = false

[dependencies]
# third-party
anyhow = { workspace = true }
async-trait = "0.1.92"
axum = "0.8.9"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
subtle = "2.6.1"
tempfile = { workspace = true }
thiserror = "2.0.21"
tokio = { workspace = true, features = ["signal"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
warpui-kit-build = { workspace = true }

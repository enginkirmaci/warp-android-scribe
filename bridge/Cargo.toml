[package]
name = "warp-android-scribe-bridge"
version = "0.1.2"
edition = "2024"
description = "LAN HTTP bridge that turns Superwhisper CLI transcriptions into a bearer-token API for warp-android-scribe"
license = "GPL-3.0"
repository = "https://github.com/enginkirmaci/warp-android-scribe"
publish = false

[dependencies]
# third-party
anyhow = "1"
async-trait = "0.1.92"
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6.1"
tempfile = "3"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util", "sync", "signal"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
warpui-kit-build = { git = "https://github.com/enginkirmaci/warp-suite", tag = "kits-v0.1.11", package = "warpui-kit-build" }
